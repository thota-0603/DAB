# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "dab-practice"

include:
  - resources/*.yml


targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-be508a58-5037.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-be508a58-5037.cloud.databricks.com
      # We always use /Users/thota.saikiran63@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/thota.saikiran63@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
